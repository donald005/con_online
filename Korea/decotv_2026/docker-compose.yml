services:
  cftunnel:
    image: cloudflare/cloudflared:latest
    container_name: cftunnel
    hostname: cftunnel
    restart: unless-stopped
    # --no-autoupdate 保留：版本更新以镜像为准，不让容器内二进制自己升级
    # token 从 .env 的 CF_TOKEN 读入，不要写死在这里
    command: tunnel --no-autoupdate run --token ${CF_TOKEN}
    # 2026-11-06 修正：不再给容器写固定 IP。
    # 之前 cftunnel 固定 10.30.0.2、decotv-core 固定 10.30.0.3，
    # 但 watchtower 没写固定 IP，先启动时被 Docker 动态分到 10.30.0.2，
    # cftunnel 再要这个 IP 就报 Address already in use。
    # 同网段内直接用容器名解析（decotv-core:3000），固定 IP 没有用。
    networks:
      - mynetwork

  decotv-core:
    image: ghcr.io/decohererk/decotv:latest
    container_name: decotv-core
    hostname: deco-server
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - mynetwork
    healthcheck:
      # 2026-11-13 修正：原来 fetch `/`，首页 layout 是 force-dynamic，
      # 每次渲染调两次 getConfig()、每次都读一次 Upstash，白白每天约 5760 条命令。
      # 改成 fetch 静态文件 /VERSION.txt，不走 layout、不读库。
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/VERSION.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  watchtower:
    # 关键改动：containrrr/watchtower 已于 2025-12-17 归档，停在 v1.7.1 不再更新
    # 改用维护中的 fork nickfedor/watchtower，配置用法完全相同
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Shanghai
      # 每天 06:00（北京时间）检查一次，6 字段 cron：秒 分 时 日 月 周
      - WATCHTOWER_SCHEDULE=0 0 6 * * *
      # 更新成功后删掉旧镜像，防止磁盘越长越大
      - WATCHTOWER_CLEANUP=true
      # 停掉的容器也检查更新（配合 revive 一起用，更新后会重新拉起来）
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=true
      # 一个一个更新，不同时停掉隧道和应用
      - WATCHTOWER_ROLLING_RESTART=true
      # 停止旧容器等 30 秒再杀，超时则强制停
      - WATCHTOWER_TIMEOUT=30
    # 三个都要写上：cftunnel + decotv-core + watchtower 自己
    # watchtower 自己在列表里时，新版本发布后它会自己更新自己并重启
    # 2026-11-13：用户决定不迁 Kvrocks，kvrocks 服务已从本文件移除
    command: --cleanup --include-stopped --revive-stopped --rolling-restart cftunnel decotv-core watchtower
    networks:
      - mynetwork

networks:
  mynetwork:
    name: mynetwork
    driver: bridge
    ipam:
      config:
        - subnet: 10.30.0.0/24
          gateway: 10.30.0.1
